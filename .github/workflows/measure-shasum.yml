name: Measure shasum

# A temporary measurement for roadmap row V1c4a (design §20.7, "V1c4 の形", Q4 with review R10): does
# `shasum -a 256 --check --ignore-missing SHA256SUMS` work on the macOS runners, with the system's /usr/bin/shasum and,
# where it exists, the system's sha256sum, and with which macOS and shasum versions. It is removed before the pull request
# is ready.
on:
  pull_request:
    paths:
      - .github/workflows/measure-shasum.yml

permissions:
  contents: read

jobs:
  shasum:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Versions
        run: |
          set +e
          sw_vers
          echo "PATH shasum: $(command -v shasum)  PATH sha256sum: $(command -v sha256sum)"
          echo "/usr/bin/shasum version: $(/usr/bin/shasum --version 2>&1)"
          ls -l /usr/bin/shasum /sbin/sha256sum /usr/bin/sha256sum 2>&1
          exit 0

      - name: Check a folder
        # One listed file that matches, one listed file whose content changed by one byte, and one listed file that is
        # missing; a file that is not listed is there too, as the archives of other systems would be in a download folder.
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/sums" && cd "$RUNNER_TEMP/sums"
          printf 'matching file\n' > match.txt
          printf 'changed file\n' > changed.txt
          printf 'missing file\n' > missing.txt
          printf 'not listed\n' > unlisted.txt
          /usr/bin/shasum -a 256 match.txt changed.txt missing.txt > SHA256SUMS
          printf 'changed filf\n' > changed.txt
          rm missing.txt
          grep -v changed.txt SHA256SUMS > MATCHONLY
          for tool in "/usr/bin/shasum -a 256" "sha256sum"; do
            if [ "$tool" = "sha256sum" ] && ! command -v sha256sum >/dev/null; then echo "=== sha256sum: not on PATH"; continue; fi
            echo "=== $tool"
            echo "--- one match, one changed, one missing, with --ignore-missing"
            $tool --check --ignore-missing SHA256SUMS; echo "exit: $?"
            echo "--- only the match and the missing, with --ignore-missing"
            $tool --check --ignore-missing MATCHONLY; echo "exit: $?"
          done
          exit 0
