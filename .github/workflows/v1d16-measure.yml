# TEMPORARY (PR #453, V1d16 review K2; removed in the next commit): NativeAOT elm-server start with a full borrow record on
# ubuntu-latest, three runners, five starts of each case on each.
name: V1d16 measure (temporary)

on:
  pull_request:
    paths:
      - .github/workflows/v1d16-measure.yml

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/admin/.node-version
          package-manager-cache: false

      - name: Build the admin UI
        working-directory: web/admin
        run: |
          corepack pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit 1 }
          corepack pnpm run build
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Prepare the records
        env:
          V1D16_PREPARE: ${{ runner.temp }}/v1d16
        run: |
          New-Item -ItemType Directory -Force $env:V1D16_PREPARE | Out-Null
          dotnet test --project tests/ElasticLM.Server.Tests -c Release -- --filter-method "*V1d16Prepare*"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Publish elm-server
        run: |
          dotnet publish src/ElasticLM.Server -c Release -r linux-x64 -o "$env:RUNNER_TEMP/server"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Measure
        env:
          CASES: ${{ runner.temp }}/v1d16
          SERVER: ${{ runner.temp }}/server/elm-server
          RUNNER_NUMBER: ${{ matrix.runner }}
        run: |
          $lines = @("runner $($env:RUNNER_NUMBER): $(nproc) CPUs")
          foreach ($case in 'case-0', 'case-999', 'case-1999') {
            $reported = @(); $wall = @(); $size = 0
            foreach ($n in 1..5) {
              $work = Join-Path $env:CASES "$case/run-$n"
              $size = (Get-ChildItem (Join-Path $work 'data') -Filter 'borrows-*.jsonl' | Sort-Object Name | Select-Object -Last 1).Length
              $clock = [Diagnostics.Stopwatch]::StartNew()
              $p = Start-Process $env:SERVER -ArgumentList @('--config', 'settings.json') -WorkingDirectory $work -RedirectStandardOutput "$work/out.log" -RedirectStandardError "$work/err.log" -PassThru
              $match = $null
              while (-not $match -and $clock.Elapsed.TotalSeconds -lt 60) {
                Start-Sleep -Milliseconds 10
                $match = Select-String -Path "$work/out.log" -Pattern 'server\.started: .* in ([0-9]+) ms' -ErrorAction SilentlyContinue
              }
              $wall += [int]$clock.Elapsed.TotalMilliseconds
              Stop-Process -Id $p.Id; $p.WaitForExit()
              if (-not $match) { Get-Content "$work/out.log", "$work/err.log"; throw "no start in $case" }
              $reported += [int]$match.Matches[0].Groups[1].Value
            }
            $lines += "${case} (newest record $size bytes): server.started $($reported -join ', ') ms; process start to that line $($wall -join ', ') ms"
          }
          $lines | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
          exit 0
