# design §20.7 (V1b, 0.114): measures the §4.2 targets on the reference machine (ubuntu-latest) against the binaries that
# release.yml ships, three times side by side, and checks every run against the targets. workflow_dispatch runs only a
# workflow that is on the default branch, so a pull request that adds or changes the measurement runs it too. The workflow
# holds no secret and every action is pinned to a commit of its own repository's tag, as release.yml does (T25).
#
# design §20.5 (V1d7, V1d10a) and §5.3 T29: any job of a run can replace another job's artifact, so a job that uploads one
# hashes its files before the upload and gives the sha256sum lines as a job output, which the job's own runner sets. A
# job that downloads the artifact checks the files against those lines and that the folder holds exactly the listed
# files. The steps named "Hash …" and "Check … against …" carry the same commands as in release.yml; "Hash the measure
# tar" and "Check the measure tar …" are release.yml's image tar steps with the file and output names changed. One
# download is not checked this way: the measure jobs' results (measure-run-*), which the report job takes by pattern
# (T29, accepted in §5.4). The legs of the measure matrix share its outputs, so one leg could set another's. A job
# outside the matrix can only take a run's name first, which fails that leg's upload and so the run: read the
# measurement on the run's result, not on the report job alone.
name: Measure

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/measure.yml
      - tools/ElasticLM.Measure/**

concurrency:
  group: measure-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # The SDK and the AlmaLinux 8 image of release.yml, so the measured binaries are built as the shipped ones (design §20.5).
  DOTNET_SDK_VERSION: 10.0.404
  ALMALINUX_IMAGE: almalinux:8@sha256:2d0f2eb2a83cc09dbc2eb92fade4dbe8f709628149e81aa00aec70630406603b
  # The gate's PostgreSQL (ci.yml).
  POSTGRES_IMAGE: postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6

jobs:
  spa:
    name: Admin UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      admin-ui-dist: ${{ steps.sums.outputs.sums }}
    defaults:
      run:
        shell: pwsh
        working-directory: web/admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/admin/.node-version
          package-manager-cache: false

      - name: Build
        run: |
          corepack pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit 1 }
          corepack pnpm build
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Hash admin-ui-dist
        id: sums
        shell: bash
        working-directory: web/admin/dist
        run: |
          set -euo pipefail
          export LC_ALL=C
          names=$(find . -mindepth 1 ! -type d | sed 's|^\./||' | sort)
          if [ -z "$names" ]; then echo "::error::The folder holds no file."; exit 1; fi
          if grep -Evq '^[A-Za-z0-9_.+/-]+$' <<<"$names"; then echo "::error::A file name has a character outside A-Z a-z 0-9 _ . + / -."; exit 1; fi
          if grep -Eq '(^|/)\.' <<<"$names"; then echo "::error::A file or folder name starts with a dot. upload-artifact leaves such files out, so the jobs that take the artifact would find them missing."; exit 1; fi
          sums=$(printf '%s\n' "$names" | xargs sha256sum -- | sed 's/^\([0-9a-f]\{64\}\) \*/\1  /')
          printf '%s\n' "$sums"
          echo "$(($(printf '%s\n' "$sums" | wc -l))) files, $(($(printf '%s\n' "$sums" | wc -c))) bytes of output."
          printf 'sums<<SUMS_END\n%s\nSUMS_END\n' "$sums" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-ui-dist
          path: web/admin/dist
          retention-days: 7

  publish:
    name: Publish linux-x64
    needs: spa
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      measure-bin: ${{ steps.sums.outputs.sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: admin-ui-dist
          path: web/admin/dist

      - name: Check admin-ui-dist against the spa job's hashes
        shell: bash
        working-directory: web/admin/dist
        env:
          SUMS: ${{ needs.spa.outputs.admin-ui-dist }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          printf '%s\n' "$SUMS" > "$RUNNER_TEMP/sums"
          if grep -q '^$' "$RUNNER_TEMP/sums"; then echo "::error::A job that made these files gave no hashes."; exit 1; fi
          sha256sum --check --strict "$RUNNER_TEMP/sums"
          diff <(cut -c67- "$RUNNER_TEMP/sums" | sort) <(find . -mindepth 1 ! -type d | sed 's|^\./||' | sort) || { echo "::error::The folder does not hold exactly the hashed files (< is missing, > is not among them)."; exit 1; }

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
          cache: false

      - name: Publish in AlmaLinux 8 (glibc 2.28)
        # The same container and script as release.yml's linux-x64 build, plus the NativeAOT samples/VerifyLicense.
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" -v "$DOTNET_ROOT:/opt/dotnet:ro" \
            -w /src -e HOME=/tmp -e DOTNET_ROOT=/opt/dotnet -e PATH=/opt/dotnet:/usr/bin:/bin \
            -e DOTNET_CLI_TELEMETRY_OPTOUT=1 -e DOTNET_NOLOGO=1 -e OWNER="$(id -u):$(id -g)" \
            "$ALMALINUX_IMAGE" bash -c '
              status=0
              options="--setopt=fastestmirror=True --setopt=max_parallel_downloads=10 --setopt=install_weak_deps=False"
              dnf install -y $options clang zlib-devel binutils libicu || status=1
              if [ $status -eq 0 ]; then
                sh eng/release/publish-rid.sh linux-x64 "" artifacts/measure/bin artifacts/measure/logs || status=1
                dotnet publish samples/VerifyLicense -c Release -r linux-x64 -o artifacts/measure/verify -nologo || status=1
              fi
              chown -R "$OWNER" /src
              exit $status'

      - name: Pack
        # A tar keeps the executables' mode, which an artifact drops.
        run: tar -C artifacts/measure -cf measure-bin.tar bin verify

      - name: Hash the measure tar
        id: sums
        shell: bash
        run: |
          set -euo pipefail
          sums=$(sha256sum -- measure-bin.tar | sed 's/^\([0-9a-f]\{64\}\) \*/\1  /')
          printf '%s\n' "$sums"
          printf 'sums<<SUMS_END\n%s\nSUMS_END\n' "$sums" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: measure-bin
          path: measure-bin.tar
          retention-days: 7

  measure:
    name: Measure (run ${{ matrix.run }})
    needs: [spa, publish]
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    runs-on: ubuntu-latest
    # design §20.7: about 28 minutes (leases 20, starts 2, activations 2, the JIT elm-service 3, the self-test 1).
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: admin-ui-dist
          path: web/admin/dist

      # Into its own folder and checked before anything runs: a replaced artifact could otherwise put files over the
      # checkout, such as tools/ElasticLM.Measure/run.ps1.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: measure-bin
          path: measure-bin

      - name: Check admin-ui-dist against the spa job's hashes
        shell: bash
        working-directory: web/admin/dist
        env:
          SUMS: ${{ needs.spa.outputs.admin-ui-dist }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          printf '%s\n' "$SUMS" > "$RUNNER_TEMP/sums"
          if grep -q '^$' "$RUNNER_TEMP/sums"; then echo "::error::A job that made these files gave no hashes."; exit 1; fi
          sha256sum --check --strict "$RUNNER_TEMP/sums"
          diff <(cut -c67- "$RUNNER_TEMP/sums" | sort) <(find . -mindepth 1 ! -type d | sed 's|^\./||' | sort) || { echo "::error::The folder does not hold exactly the hashed files (< is missing, > is not among them)."; exit 1; }

      - name: Check the measure tar against the publish job's hash
        shell: bash
        working-directory: measure-bin
        env:
          SUMS: ${{ needs.publish.outputs.measure-bin }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          printf '%s\n' "$SUMS" > "$RUNNER_TEMP/sums"
          if grep -q '^$' "$RUNNER_TEMP/sums"; then echo "::error::A job that made these files gave no hashes."; exit 1; fi
          sha256sum --check --strict "$RUNNER_TEMP/sums"
          diff <(cut -c67- "$RUNNER_TEMP/sums" | sort) <(find . -mindepth 1 ! -type d | sed 's|^\./||' | sort) || { echo "::error::The folder does not hold exactly the hashed files (< is missing, > is not among them)."; exit 1; }

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
          cache: false

      - name: Measure
        env:
          MEASURE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          New-Item -ItemType Directory measure | Out-Null
          tar -C measure -xf measure-bin/measure-bin.tar
          docker run -d --name elm-measure-postgres -e POSTGRES_PASSWORD=elm-measure -p 5434:5432 $env:POSTGRES_IMAGE | Out-Null
          for ($i = 0; $i -lt 60; $i++) {
            docker exec elm-measure-postgres pg_isready -U postgres | Out-Null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 1
          }
          if ($LASTEXITCODE -ne 0) { "::error::PostgreSQL did not start"; exit 1 }
          try {
            ./tools/ElasticLM.Measure/run.ps1 -Bin measure/bin -VerifyLicense measure/verify/VerifyLicense -Out run-${{ matrix.run }}.json -Logs measure-logs `
              -Postgres 'Host=127.0.0.1;Port=5434;Username=postgres;Password=elm-measure;Database=postgres'
          }
          finally {
            docker rm -f elm-measure-postgres | Out-Null
          }

      # design §20.7 (V1d31): a run that stopped early keeps what it measured, and Report fails it on the missing values.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: measure-run-${{ matrix.run }}
          path: run-${{ matrix.run }}.json
          retention-days: 90

      # Issue #393: run.ps1 keeps the measured processes' whole logs when the run stopped on an error or a lease or
      # activation request failed; the job log shows only their last lines. The products' logs hold no secret (design §18).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: measure-logs-${{ matrix.run }}
          path: measure-logs
          if-no-files-found: ignore
          retention-days: 90

  report-test:
    name: Report judgment test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the report's judgment
        # design §4.2 and §20.7 (V1d31): runs on a slow disk, with figures of recorded runs.
        run: ./tools/ElasticLM.Measure/Test-Report.ps1

  report:
    name: Report
    needs: measure
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Not checked against the measure jobs (T29, accepted in §5.4): the legs share the outputs, so a check could not tell
      # one leg's file from another's. An added artifact that holds a run-*.json makes the count other than 3, which fails.
      # A name taken first by another job fails that leg's upload, so the run fails even when this job passes.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: measure-run-*
          path: results

      - name: Compare with the targets
        # design §20.7: every run against every §4.2 target, the activation p99 on the runs whose disk flush p99 is at most
        # 20 ms (V1d31); a missing run or a missing value fails too.
        run: ./tools/ElasticLM.Measure/Report.ps1 -Results results -Expected 3
