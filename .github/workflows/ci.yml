# design §20.5 (V1d7, V1d10a) and §5.3 T29: any job of a run can replace another job's artifact, so a job that uploads one
# hashes its files before the upload and gives the sha256sum lines as a job output, which the job's own runner sets. A
# job that downloads the artifact checks the files against those lines and that the folder holds exactly the listed
# files. The steps named "Hash …" and "Check … against …" carry the same commands as in release.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A pull request's run is cancelled by its next push. A run on main is never cancelled: every merge's CI is read
# (.cursor/rules/workflow.mdc), and a cancelled run has no result (Issue #163).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  spa:
    # design §15.2 (decisions 0.96 and 0.100, T21): the admin UI is built once, here, with no secret and no id-token; the
    # .NET jobs take its dist from this run and run no Node.js tool. The actions of this job, and the download that takes
    # its output, are pinned by commit, since what it builds goes into the shipped executable.
    name: Admin UI (web/admin)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      admin-ui-dist: ${{ steps.sums.outputs.sums }}
    defaults:
      run:
        shell: pwsh
        working-directory: web/admin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/admin/.node-version
          package-manager-cache: false

      - name: Install, check, test, and build
        # Corepack checks pnpm's version and hash against packageManager; pnpm-workspace.yaml holds strictDepBuilds and
        # minimumReleaseAge. pnpm audit stands in for Dependabot's alerts, which pnpm 12's lockfile does not get (design §5.4).
        run: |
          corepack pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit 1 }
          corepack pnpm audit
          if ($LASTEXITCODE -ne 0) { exit 1 }
          corepack pnpm run typecheck
          if ($LASTEXITCODE -ne 0) { exit 1 }
          corepack pnpm test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          corepack pnpm run build
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $files = @(Get-ChildItem dist -Recurse -File)
          "web/admin/dist: $($files.Count) files, $(($files | Measure-Object Length -Sum).Sum) bytes" >> $env:GITHUB_STEP_SUMMARY

      - name: Hash admin-ui-dist
        id: sums
        shell: bash
        working-directory: web/admin/dist
        run: |
          set -euo pipefail
          export LC_ALL=C
          names=$(find . -mindepth 1 ! -type d | sed 's|^\./||' | sort)
          if [ -z "$names" ]; then echo "::error::The folder holds no file."; exit 1; fi
          if grep -Evq '^[A-Za-z0-9_.+/-]+$' <<<"$names"; then echo "::error::A file name has a character outside A-Z a-z 0-9 _ . + / -."; exit 1; fi
          if grep -Eq '(^|/)\.' <<<"$names"; then echo "::error::A file or folder name starts with a dot. upload-artifact leaves such files out, so the jobs that take the artifact would find them missing."; exit 1; fi
          sums=$(printf '%s\n' "$names" | xargs sha256sum -- | sed 's/^\([0-9a-f]\{64\}\) \*/\1  /')
          printf '%s\n' "$sums"
          echo "$(($(printf '%s\n' "$sums" | wc -l))) files, $(($(printf '%s\n' "$sums" | wc -c))) bytes of output."
          printf 'sums<<SUMS_END\n%s\nSUMS_END\n' "$sums" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-ui-dist
          path: web/admin/dist
          retention-days: 1
          if-no-files-found: error

  gate:
    name: build.ps1 (${{ matrix.os }})
    needs: spa
    strategy:
      fail-fast: false
      matrix:
        # The client SDK and the server ship for all three; each OS reads its machine ID its own way.
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      # The admin UI of this run's SPA job (design §15.2); build.ps1 -SkipWeb and the publish embed it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: admin-ui-dist
          path: web/admin/dist

      - name: Check admin-ui-dist against the spa job's hashes
        shell: bash
        working-directory: web/admin/dist
        env:
          SUMS: ${{ needs.spa.outputs.admin-ui-dist }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          printf '%s\n' "$SUMS" > "$RUNNER_TEMP/sums"
          if grep -q '^$' "$RUNNER_TEMP/sums"; then echo "::error::A job that made these files gave no hashes."; exit 1; fi
          sha256sum --check --strict "$RUNNER_TEMP/sums"
          diff <(cut -c67- "$RUNNER_TEMP/sums" | sort) <(find . -mindepth 1 ! -type d | sed 's|^\./||' | sort) || { echo "::error::The folder does not hold exactly the hashed files (< is missing, > is not among them)."; exit 1; }

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # design §14.2, decision 0.62: the service's tests also run on PostgreSQL 18, on Linux, where service containers run.
      # The image is pinned by digest (postgres:18 on 2026-10-21); a newer one is taken by changing the digest in a PR.
      - name: PostgreSQL
        if: runner.os == 'Linux'
        run: |
          docker run -d --name elm-postgres -e POSTGRES_PASSWORD=elm-ci -p 5432:5432 postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
          for ($i = 0; $i -lt 60; $i++) {
            docker exec elm-postgres pg_isready -U postgres | Out-Null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 1
          }
          if ($LASTEXITCODE -ne 0) { "::error::PostgreSQL did not start"; exit 1 }
          "ELM_TEST_POSTGRES=Host=127.0.0.1;Port=5432;Username=postgres;Password=elm-ci;Database=postgres" >> $env:GITHUB_ENV

      # design §15.3, decision 0.97 (M5a): the OIDC sign-in is checked end to end against Keycloak, on Linux. The image is
      # pinned by digest (26.8.0, published 2026-10-10); a newer one is taken by changing the digest in a PR. The realm is a
      # test file with a test user only.
      - name: Keycloak
        if: runner.os == 'Linux'
        run: |
          docker run -d --name elm-keycloak -p 8180:8080 -v "${{ github.workspace }}/tests/keycloak:/opt/keycloak/data/import:ro" quay.io/keycloak/keycloak@sha256:27b3230fbabb8c9ff3c66c864cf09dcd8a41aca82e5100679d109ef0eeb05741 start-dev --import-realm
          for ($i = 0; $i -lt 120; $i++) {
            try { Invoke-WebRequest -Uri http://127.0.0.1:8180/realms/elm/.well-known/openid-configuration -UseBasicParsing | Out-Null; $ready = $true; break } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $ready) { docker logs elm-keycloak; "::error::Keycloak did not start"; exit 1 }
          "ELM_TEST_KEYCLOAK=http://127.0.0.1:8180/realms/elm" >> $env:GITHUB_ENV

      - name: Gate
        run: ./build.ps1 -SkipWeb

  # Temporary (V1d24, Issue #343, the owner's K2): the client's tests on Intel macOS (stat$INODE64) and arm64 Linux
  # (statx); removed by the next commit.
  v1d24-probe:
    name: V1d24 client tests (${{ matrix.os }})
    needs: spa
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: admin-ui-dist
          path: web/admin/dist
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Client tests
        run: |
          uname -a
          dotnet test --project tests/ElasticLM.Client.Tests -c Release
          exit $LASTEXITCODE

  aot:
    # design §20.3: each shipped executable and libelasticlm (§17.4) is published with NativeAOT on every OS, with zero
    # warnings.
    name: NativeAOT elm-server, elm, elm-service, and libelasticlm (${{ matrix.os }})
    needs: spa
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      # The admin UI of this run's SPA job (design §15.2); build.ps1 -SkipWeb and the publish embed it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: admin-ui-dist
          path: web/admin/dist

      - name: Check admin-ui-dist against the spa job's hashes
        shell: bash
        working-directory: web/admin/dist
        env:
          SUMS: ${{ needs.spa.outputs.admin-ui-dist }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          printf '%s\n' "$SUMS" > "$RUNNER_TEMP/sums"
          if grep -q '^$' "$RUNNER_TEMP/sums"; then echo "::error::A job that made these files gave no hashes."; exit 1; fi
          sha256sum --check --strict "$RUNNER_TEMP/sums"
          diff <(cut -c67- "$RUNNER_TEMP/sums" | sort) <(find . -mindepth 1 ! -type d | sed 's|^\./||' | sort) || { echo "::error::The folder does not hold exactly the hashed files (< is missing, > is not among them)."; exit 1; }

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-aot-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: nuget-aot-${{ runner.os }}-

      - name: Publish
        # design §20.5: the same publish as release.yml, one folder for each of the four, with zero warnings.
        run: ./eng/release/Publish-Rid.ps1 -Rid ${{ matrix.rid }} -OutDir publish -LogDir publish-logs

      - name: Check the publish folders
        # design §4.1, §4.2, §20.5: single binary, runtime dependencies, macOS signature, and sizes. CI builds Linux on the
        # runner's glibc, so the glibc version is recorded only; release.yml builds against glibc 2.28 and applies the limit.
        run: ./eng/release/Test-Publish.ps1 -Rid ${{ matrix.rid }} -PublishDir publish -LogDir publish-logs -RecordGlibcOnly

      - name: C test of libelasticlm
        # design §17.4: the exports against the header, the build-time link test (decision 0.118; the publish has no version
        # suffix, so run.ps1's default version applies), then the C test compiled with warnings as errors and run against
        # the published library with keys and licenses made by elm. design §17.5: the activation test runs against the
        # published elm-service on loopback, and design §17.6 the lease test against the published elm-server on https.
        run: |
          $name = $IsWindows ? 'elasticlm.dll' : ($IsMacOS ? 'libelasticlm.dylib' : 'libelasticlm.so')
          ./tests/native/run.ps1 -Library (Join-Path publish/libelasticlm $name) -Elm (Join-Path publish/elm ($IsWindows ? 'elm.exe' : 'elm')) -Service (Join-Path publish/elm-service ($IsWindows ? 'elm-service.exe' : 'elm-service')) -Server (Join-Path publish/elm-server ($IsWindows ? 'elm-server.exe' : 'elm-server'))

      - name: End-to-end tests
        # design §20.7 (V1a): tests/ElasticLM.E2E runs the published elm, elm-server, and elm-service as processes with
        # ElasticLM.Client as the app. On Linux the service's flows also run on PostgreSQL, in a container of this step's own
        # with the gate's image; the run's real-clock waits stay within 2 minutes and go to the job summary.
        run: |
          if ($IsLinux) {
            docker run -d --name elm-e2e-postgres -e POSTGRES_PASSWORD=elm-e2e -p 5433:5432 postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
            for ($i = 0; $i -lt 60; $i++) {
              docker exec elm-e2e-postgres pg_isready -U postgres | Out-Null
              if ($LASTEXITCODE -eq 0) { break }
              Start-Sleep -Seconds 1
            }
            if ($LASTEXITCODE -ne 0) { "::error::PostgreSQL did not start"; exit 1 }
            $env:ELM_E2E_POSTGRES = 'Host=127.0.0.1;Port=5433;Username=postgres;Password=elm-e2e'
          }
          try {
            ./tests/ElasticLM.E2E/run.ps1 -Bin publish
          }
          finally {
            if ($IsLinux) { docker rm -f elm-e2e-postgres | Out-Null }
          }

      - name: Guide steps
        # design §20.7 (V1c1, V1c3a, V1c3b, V1c3e, V1c3d, V1c3c, V1c4a, V1c4b, V1c4e, V1c13, V1c4f): the marked steps of README.md,
        # of each Tutorial, and of each How-to guide, run in a work folder outside the clone. Each Tutorial runs once; a How-to
        # guide runs in a copy of the end state of the Tutorial that its steps:after marker names, whose background process
        # starts again in the copy, and the Tutorial's folders are removed after the last guide that names it (V1c13); each
        # steps:background block of a How-to guide stops the process that runs and starts its own line instead, except one
        # that starts the other program (elm-server beside the Tutorial's elm-service), which runs beside it (V1c4f). Where a
        # page has the reader download from a GitHub prerelease, its steps:prebuilt marker puts the published elm,
        # elm-server, elm-service, and libelasticlm, and the packages packed here, in their place. The packages get a prerelease version, as release.yml gives a pull request's run, so that the page's dotnet add
        # --prerelease finds only prerelease versions in its packages folder, as a reader of a prerelease does.
        # NUGET_PACKAGES points to a new folder for each page, so the cache above never holds the packages of one run. A
        # page's steps:background block runs elm-server, or elm-service on http://127.0.0.1:8080, in the background,
        # without any ELM_ variable except the signing key's passphrase for elm-service, and the script stops its process
        # tree at the end of the page. Tutorial 4 builds its C sample with cl on Windows (the script reads the MSVC x64
        # environment for that line and the app's line only) and with cc on Linux and macOS, and skips the blocks of the
        # other systems. A How-to guide publishes the Tutorial 1 app with NativeAOT and runs it; on Windows the script puts the
        # Visual Studio Installer folder on PATH for that dotnet line, as the Publish step does (V1c4e). Without -Docker, a page
        # with docker lines (the container and PostgreSQL guides) is skipped as a whole and printed as skip: <page>;
        # release.yml's guide-containers job runs them with this run's image (V1c4d2). The PostgreSQL digest that such a page
        # names is still checked here against the one of the PostgreSQL steps above (V1c4d2, Q10).
        run: |
          foreach ($project in 'src/ElasticLM.Licensing', 'src/ElasticLM.Client') {
            dotnet pack $project -c Release -o guide-feed -nologo "-p:VersionSuffix=ci.$env:GITHUB_RUN_NUMBER"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          ./eng/docs/Test-GuideSteps.ps1 -Elm (Join-Path publish/elm ($IsWindows ? 'elm.exe' : 'elm')) -ElmServer (Join-Path publish/elm-server ($IsWindows ? 'elm-server.exe' : 'elm-server')) -ElmService (Join-Path publish/elm-service ($IsWindows ? 'elm-service.exe' : 'elm-service')) -Feed guide-feed -Library publish/libelasticlm

      - name: Smoke
        run: |
          $elm = Join-Path publish/elm ($IsWindows ? 'elm.exe' : 'elm')
          & $elm --help
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $exe = Join-Path publish/elm-server ($IsWindows ? 'elm-server.exe' : 'elm-server')
          & $exe --help
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:ELM_PRODUCT = 'acme-cad'
          $out = & $exe 2>&1 | Out-String
          if ($LASTEXITCODE -ne 1 -or $out -notmatch 'trust.rootKeys') { $out; "::error::elm-server did not refuse to start without trust"; exit 1 }
          # The expected exit code 1 would otherwise become the step's result.
          exit 0

      - name: Smoke elm-service
        # The single executable with SQLite linked in (design §14.2): keys made by elm, setup prints a key, the service starts
        # with nothing beside it, answers /health, and serves the audit log to the key.
        run: |
          $elm = Join-Path publish/elm ($IsWindows ? 'elm.exe' : 'elm')
          $service = Join-Path publish/elm-service ($IsWindows ? 'elm-service.exe' : 'elm-service')
          $env:ELM_KEY_PASSPHRASE = 'ci smoke passphrase 0123'
          & $elm key root create --out root.key.pem --public-out root.pub.pem
          & $elm key signing create --out signing.key.pem --public-out signing.pub.pem
          & $elm key certify --root root.key.pem --public signing.pub.pem --use license lease --out signing.cert
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:ELM_SIGNING_PASSPHRASE = $env:ELM_KEY_PASSPHRASE
          # design §14.8: the nonces' secret has no default; a random one is made for this run and not kept.
          $env:ELM_NONCE_SECRET = [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(32))
          $env:ELM_SIGNING_KEY = 'signing.key.pem'
          $env:ELM_SIGNING_CERTIFICATES = 'signing.cert'
          $env:ELM_TRUST_ROOTKEYS = 'root.pub.pem'
          $env:ELM_DATABASE_CONNECTION = 'Data Source=smoke.db'
          $env:ELM_BOOTSTRAPOWNER_ISS = 'https://idp.example'
          $env:ELM_BOOTSTRAPOWNER_SUB = 'ci'
          $env:ELM_LISTEN = 'http://127.0.0.1:18080'
          $key = (& $service setup).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $key.StartsWith('elm_')) { "::error::elm-service setup did not print a key"; exit 1 }
          $process = Start-Process $service -PassThru -NoNewWindow
          try {
            $ok = $false
            for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
              try { $ok = (Invoke-WebRequest http://127.0.0.1:18080/health -SkipHttpErrorCheck).StatusCode -eq 200 } catch { }
              if (-not $ok) { Start-Sleep -Seconds 1 }
            }
            if (-not $ok) { "::error::elm-service did not answer /health"; exit 1 }
            $audit = Invoke-RestMethod http://127.0.0.1:18080/v1/admin/audit -Headers @{ Authorization = "Bearer $key" }
            if ($audit.items.Count -lt 1) { "::error::the audit log is empty"; exit 1 }
          }
          finally {
            Stop-Process -Id $process.Id
            $process.WaitForExit()
          }

          # design §15.2 (M5c): with the web sign-in on, the executable alone serves the admin UI. The issuer is a stand-in:
          # the service does not reach the identity provider to start or to serve the UI. The secret and the key encryption
          # key are made for this run and not kept.
          $env:ELM_OIDC_ISSUER = 'https://idp.example'
          $env:ELM_OIDC_AUDIENCE = 'elm-service'
          $env:ELM_OIDC_CLICLIENTID = 'elm-cli'
          $env:ELM_OIDC_ROLEMAP = 'elm-owners=owner'
          $env:ELM_OIDC_WEBCLIENTID = 'elm-web'
          $env:ELM_OIDC_WEBCLIENTSECRET = [Convert]::ToHexString([Security.Cryptography.RandomNumberGenerator]::GetBytes(16))
          $env:ELM_DATAPROTECTION_KEK = [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(32))
          $process = Start-Process $service -PassThru -NoNewWindow
          try {
            $index = $null
            for ($i = 0; $i -lt 30 -and -not $index; $i++) {
              try { $index = Invoke-WebRequest http://127.0.0.1:18080/ } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $index -or $index.StatusCode -ne 200) { "::error::elm-service did not serve the admin UI at /"; exit 1 }
            if ([string]$index.Headers['Content-Security-Policy'] -notmatch "^default-src 'self';") { "::error::/ has no CSP"; exit 1 }
            $asset = [regex]::Match($index.Content, '/assets/[A-Za-z0-9_.-]+\.js').Value
            $script = Invoke-WebRequest "http://127.0.0.1:18080$asset"
            if ($script.StatusCode -ne 200 -or [string]$script.Headers['Content-Type'] -ne 'text/javascript') { "::error::$asset was not served as text/javascript"; exit 1 }
            "elm-service (${{ matrix.rid }}) served / and $asset" >> $env:GITHUB_STEP_SUMMARY
          }
          finally {
            Stop-Process -Id $process.Id
          }
          exit 0

      - name: Measure elm-service on PostgreSQL
        # design §4.2 (M4a1): the time from start to listening on PostgreSQL 18, from the service.started record, three
        # starts on a migrated database.
        if: runner.os == 'Linux'
        run: |
          docker run -d --name elm-postgres -e POSTGRES_PASSWORD=elm-ci -p 5432:5432 postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
          for ($i = 0; $i -lt 60; $i++) {
            docker exec elm-postgres pg_isready -U postgres | Out-Null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 1
          }
          if ($LASTEXITCODE -ne 0) { "::error::PostgreSQL did not start"; exit 1 }
          $elm = Join-Path publish/elm 'elm'
          $service = Join-Path publish/elm-service 'elm-service'
          New-Item -ItemType Directory pg | Out-Null
          $env:ELM_KEY_PASSPHRASE = 'ci measure passphrase 0123'
          & $elm key root create --out pg/root.key.pem --public-out pg/root.pub.pem
          & $elm key signing create --out pg/signing.key.pem --public-out pg/signing.pub.pem
          & $elm key certify --root pg/root.key.pem --public pg/signing.pub.pem --use license lease --out pg/signing.cert
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:ELM_SIGNING_PASSPHRASE = $env:ELM_KEY_PASSPHRASE
          # design §14.8: the nonces' secret has no default; a random one is made for this run and not kept.
          $env:ELM_NONCE_SECRET = [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(32))
          $env:ELM_SIGNING_KEY = 'pg/signing.key.pem'
          $env:ELM_SIGNING_CERTIFICATES = 'pg/signing.cert'
          $env:ELM_TRUST_ROOTKEYS = 'pg/root.pub.pem'
          $env:ELM_DATABASE_PROVIDER = 'postgres'
          $env:ELM_DATABASE_CONNECTION = 'Host=127.0.0.1;Port=5432;Username=postgres;Password=elm-ci;Database=postgres'
          $env:ELM_BOOTSTRAPOWNER_ISS = 'https://idp.example'
          $env:ELM_BOOTSTRAPOWNER_SUB = 'ci'
          $env:ELM_LISTEN = 'http://127.0.0.1:18081'
          $key = (& $service setup).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $key.StartsWith('elm_')) { "::error::elm-service setup did not print a key on PostgreSQL"; exit 1 }
          foreach ($run in 1..3) {
            $process = Start-Process $service -PassThru -RedirectStandardOutput "pg/run$run.log"
            try {
              $ok = $false
              for ($i = 0; $i -lt 50 -and -not $ok; $i++) {
                try { $ok = (Invoke-WebRequest http://127.0.0.1:18081/health -SkipHttpErrorCheck).StatusCode -eq 200 } catch { }
                if (-not $ok) { Start-Sleep -Milliseconds 200 }
              }
              if (-not $ok) { "::error::elm-service did not answer /health on PostgreSQL"; exit 1 }
            }
            finally {
              Stop-Process -Id $process.Id
              $process.WaitForExit()
            }
            $started = Select-String -Path "pg/run$run.log" -Pattern 'service.started: .* in ([0-9]+) ms' | Select-Object -First 1
            if (-not $started) { "::error::no service.started record"; exit 1 }
            "elm-service start on PostgreSQL 18 (run $run): $($started.Matches[0].Groups[1].Value) ms" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
          }
          Remove-Item -Recurse -Force pg
