name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  gate:
    name: build.ps1 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The client SDK and the server ship for all three; each OS reads its machine ID its own way.
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Gate
        run: ./build.ps1

  aot:
    # design §20.3: each shipped executable is published with NativeAOT on every OS, with zero warnings.
    name: NativeAOT elm-server (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-aot-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: nuget-aot-${{ runner.os }}-

      - name: Publish
        run: |
          $log = dotnet publish src/ElasticLM.Server -c Release -r ${{ matrix.rid }} -o publish -nologo 2>&1
          $log
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $warnings = @($log | Select-String -Pattern ': warning ')
          if ($warnings.Count -gt 0) { "::error::NativeAOT publish reported $($warnings.Count) warnings"; exit 1 }
          $exe = Get-Item (Join-Path publish ($IsWindows ? 'elm-server.exe' : 'elm-server'))
          "elm-server (${{ matrix.rid }}): $($exe.Length) bytes, 0 warnings" >> $env:GITHUB_STEP_SUMMARY

      - name: Smoke
        run: |
          $exe = Join-Path publish ($IsWindows ? 'elm-server.exe' : 'elm-server')
          & $exe --help
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:ELM_PRODUCT = 'acme-cad'
          $out = & $exe 2>&1 | Out-String
          if ($LASTEXITCODE -ne 1 -or $out -notmatch 'trust.rootKeys') { $out; "::error::elm-server did not refuse to start without trust"; exit 1 }
