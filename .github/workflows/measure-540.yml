# A temporary measurement for V1d30a (Issue #540), removed before the pull request is ready (.cursor/rules/open-ends.mdc).
# Runs 46153160165, 46159240509, and 46162140975 measured the systemd hardening, name resolution, the facts the design
# cites, and the copy-and-cut rotation of a small log file. This last form measures the lines lost when the sample's
# job rotates a log file of 10 MiB, the size it waits for.
name: Measure V1d30a (temporary)

on:
  pull_request:
    paths:
      - .github/workflows/measure-540.yml

concurrency:
  group: measure-540-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  launchd:
    name: launchd log rotation of 10 MiB
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Measure
        shell: bash
        run: |
          set +e
          sw_vers
          id=$(openssl rand -hex 4)
          label="elm-e2e-loss-$id"
          logs="/Library/Logs/$label"
          log="$logs/elm-server.log"
          plist="/Library/LaunchDaemons/$label.plist"
          sudo install -d -m 0755 "$logs"
          sudo install -m 0640 -o nobody -g nobody /dev/null "$log"
          cat > "$RUNNER_TEMP/$label.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>Label</key><string>$label</string>
            <key>ProgramArguments</key>
            <array><string>/usr/bin/perl</string><string>-e</string><string>\$|=1; my \$i=0; while (1) { print ++\$i, "\\n"; select(undef, undef, undef, 0.001); }</string></array>
            <key>UserName</key><string>nobody</string>
            <key>GroupName</key><string>nobody</string>
            <key>RunAtLoad</key><true/>
            <key>StandardOutPath</key><string>$log</string>
            <key>StandardErrorPath</key><string>$log</string>
          </dict>
          </plist>
          EOF
          sudo install -m 0644 -o root -g wheel "$RUNNER_TEMP/$label.plist" "$plist"
          sudo launchctl bootstrap system "$plist"; echo "launchd-loss: bootstrap exit $?"
          # The sample's own command, with this run's folder and its size of 10 MiB.
          cmd=$(plutil -extract ProgramArguments.2 raw samples/ElmServerService/macos/elm-server-log.plist)
          cmd=$(printf '%s' "$cmd" | sed "s|/Library/Logs/elm-server/|$logs/|")
          echo "launchd-loss: command: $cmd"
          # 10 MiB of filler lines before the writer's numbers, appended as root so that the size is reached at once.
          for n in $(seq 1 10); do
            perl -e 'print "x" x 99, "\n" for 1..105000' | sudo tee -a "$log" > /dev/null
            sleep 0.5
            size=$(stat -f %z "$log")
            start=$(perl -MTime::HiRes=time -e 'printf "%.6f", time')
            sudo /bin/sh -c "$cmd"; code=$?
            end=$(perl -MTime::HiRes=time -e 'printf "%.6f", time')
            sleep 0.5
            last=$(sudo grep -E '^[0-9]+$' "$log.0" | tail -n 1); first=$(sudo grep -E '^[0-9]+$' "$log" | head -n 1)
            nul=$(sudo head -c 64 "$log" | tr -cd '\000' | wc -c | tr -d ' ')
            echo "launchd-loss: run $n size before $size exit $code took $(echo "$end - $start" | bc) s; last in .0 $last; first in the cut file $first; lost $((first - last - 1)); zero bytes at the start $nul; size of .0 $(stat -f %z "$log.0"), of the cut file $(stat -f %z "$log")"
          done
          echo "launchd-loss: files:"; ls -l "$logs"
          sudo launchctl bootout "system/$label"; echo "launchd-loss: bootout exit $?"
          sudo rm -f "$plist"; sudo rm -rf "${logs:?}"; rm -f "$RUNNER_TEMP/$label.plist"
          exit 0
