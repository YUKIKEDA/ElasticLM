# A temporary measurement for V1d30a (Issue #540), removed before the pull request is ready (.cursor/rules/open-ends.mdc).
# The first run (46153160165) measured the systemd hardening directives one by one and together, and the launchd log
# rotation. This second form measures what the implementation needs: name resolution through the outside DNS under the
# chosen directives, the values systemctl show prints for them, and the manual pages of journald.conf and newsyslog.conf
# on the runners.
name: Measure V1d30a (temporary)

on:
  pull_request:
    paths:
      - .github/workflows/measure-540.yml
      - tests/ElasticLM.E2E/HardeningMeasurementTests.cs

concurrency:
  group: measure-540-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  publish:
    name: Publish linux-x64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/admin/.node-version
          package-manager-cache: false

      - name: Build the admin UI
        shell: pwsh
        working-directory: web/admin
        run: |
          corepack pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit 1 }
          corepack pnpm run build
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Publish
        shell: pwsh
        run: ./eng/release/Publish-Rid.ps1 -Rid linux-x64 -OutDir publish -LogDir publish-logs

      # A tar keeps the executable bits, which the artifact's zip does not.
      - name: Pack
        run: tar -cf publish.tar publish

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-publish
          path: publish.tar
          retention-days: 1
          if-no-files-found: error

  systemd:
    name: systemd (all)
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-publish

      - name: Measure
        shell: bash
        run: |
          set +e
          tar -xf publish.tar
          export ELM_E2E_BIN="$PWD/publish"
          export ELM_E2E_NOTES="$RUNNER_TEMP/notes.txt"
          export ELM_E2E_HARDENING_VARIANT=all
          dotnet test --project tests/ElasticLM.E2E/ElasticLM.E2E.csproj -c Release -- --filter-class "*HardeningMeasurementTests"
          echo "measure: dotnet test exit code $?"
          cat "$ELM_E2E_NOTES"
          exit 0

  journald:
    name: journald facts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read
        shell: bash
        run: |
          set +e
          echo "facts: systemd-analyze cat-config systemd/journald.conf"; systemd-analyze cat-config --no-pager systemd/journald.conf
          echo "facts: journalctl --disk-usage: $(journalctl --disk-usage 2>&1)"
          echo "facts: man journald.conf"; MANPAGER=cat man journald.conf | col -b
          echo "facts: man exit code $?"
          exit 0

  newsyslog:
    name: newsyslog facts
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Read
        shell: bash
        run: |
          set +e
          sw_vers
          echo "facts: man newsyslog.conf"; MANPAGER=cat man newsyslog.conf | col -b
          echo "facts: man exit code $?"
          echo "facts: ls /etc/newsyslog.d"; ls -l /etc/newsyslog.d
          echo "facts: launchctl print system/com.apple.newsyslog"; sudo launchctl print system/com.apple.newsyslog | grep -E 'path|program|StartCalendarInterval|interval|Minute|Hour' | head -20
          exit 0
