# TEMPORARY (V1d7, Issue #325): delete this file before the pull request is ready.
#
# Measures two things on GitHub's runners, which nothing local can show:
#   1. whether a job of a run can replace, with upload-artifact's overwrite, an artifact that another job of the same run
#      uploaded (design §5.3 T22 rests on it);
#   2. whether the check of release.yml then fails. The "Hash" and "Check" steps carry release.yml's commands unchanged.
# The last job passes only when every replaced artifact was refused and the untouched one was accepted.
name: V1d7 negative test (temporary)

on:
  pull_request:

permissions:
  contents: read

jobs:
  produce:
    name: Upload six copies of one folder
    if: github.head_ref == 'ci/325-artifact-digests'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sums: ${{ steps.sums.outputs.sums }}
    steps:
      - name: Make the folder
        run: |
          mkdir -p folder/assets
          printf 'index\n' > folder/index.html
          printf 'script\n' > folder/assets/index-1.js
          printf 'style\n' > folder/assets/index-1.css

      - name: Hash the folder
        id: sums
        shell: bash
        working-directory: folder
        run: |
          set -euo pipefail
          export LC_ALL=C
          names=$(find . -mindepth 1 ! -type d | sed 's|^\./||' | sort)
          if [ -z "$names" ]; then echo "::error::The folder holds no file."; exit 1; fi
          if grep -Evq '^[A-Za-z0-9_.+/-]+$' <<<"$names"; then echo "::error::A file name has a character outside A-Z a-z 0-9 _ . + / -."; exit 1; fi
          if grep -Eq '(^|/)\.' <<<"$names"; then echo "::error::A file or folder name starts with a dot. upload-artifact leaves such files out, so the jobs that take the artifact would find them missing."; exit 1; fi
          sums=$(printf '%s\n' "$names" | xargs sha256sum -- | sed 's/^\([0-9a-f]\{64\}\) \*/\1  /')
          printf '%s\n' "$sums"
          echo "$(($(printf '%s\n' "$sums" | wc -l))) files, $(($(printf '%s\n' "$sums" | wc -c))) bytes of output."
          printf 'sums<<SUMS_END\n%s\nSUMS_END\n' "$sums" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tmp-v1d7-untouched
          path: folder
          retention-days: 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tmp-v1d7-changed
          path: folder
          retention-days: 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tmp-v1d7-added
          path: folder
          retention-days: 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tmp-v1d7-hidden
          path: folder
          retention-days: 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tmp-v1d7-missing
          path: folder
          retention-days: 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tmp-v1d7-renamed
          path: folder
          retention-days: 1

  replace:
    # Another job of the same run, with contents: read only, uploads under the first job's artifact names.
    name: Replace ${{ matrix.case }} from another job
    needs: produce
    strategy:
      fail-fast: false
      matrix:
        case: [changed, added, hidden, missing, renamed]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Make the folder that replaces the artifact
        env:
          CASE: ${{ matrix.case }}
        run: |
          mkdir -p folder/assets
          printf 'index\n' > folder/index.html
          printf 'script\n' > folder/assets/index-1.js
          printf 'style\n' > folder/assets/index-1.css
          case "$CASE" in
            changed) printf 'another script\n' > folder/assets/index-1.js ;;
            added) printf 'more\n' > folder/assets/extra.js ;;
            hidden) printf 'more\n' > folder/.hidden ;;
            missing) rm folder/index.html ;;
            renamed) mv folder/assets/index-1.css folder/assets/index-2.css ;;
          esac
          find folder -type f | sort

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        continue-on-error: true
        with:
          name: tmp-v1d7-${{ matrix.case }}
          path: folder
          overwrite: true
          include-hidden-files: true
          retention-days: 1

      - name: Write whether the upload replaced the artifact
        env:
          CASE: ${{ matrix.case }}
          OUTCOME: ${{ steps.upload.outcome }}
        run: |
          echo "MEASURED: upload-artifact with overwrite: true, from another job of the same run, on tmp-v1d7-$CASE: $OUTCOME" | tee -a "$GITHUB_STEP_SUMMARY"

  check:
    name: Check ${{ matrix.case }} on ${{ matrix.os }}
    needs: [produce, replace]
    # The replace jobs' own result is not a condition: each leg reads what happened.
    if: ${{ !cancelled() && needs.produce.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        case: [untouched, changed, added, hidden, missing, renamed]
        # Every runner on which a job of release.yml runs the check.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: download
        continue-on-error: true
        with:
          name: tmp-v1d7-${{ matrix.case }}
          path: folder

      - name: Check the folder against the produce job's hashes
        id: check
        continue-on-error: true
        shell: bash
        working-directory: folder
        env:
          SUMS: ${{ needs.produce.outputs.sums }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          printf '%s\n' "$SUMS" > "$RUNNER_TEMP/sums"
          if grep -q '^$' "$RUNNER_TEMP/sums"; then echo "::error::A job that made these files gave no hashes."; exit 1; fi
          sha256sum --check --strict "$RUNNER_TEMP/sums"
          diff <(cut -c67- "$RUNNER_TEMP/sums" | sort) <(find . -mindepth 1 ! -type d | sed 's|^\./||' | sort) || { echo "::error::The folder does not hold exactly the hashed files (< is missing, > is not among them)."; exit 1; }

      # The leg fails unless the outcome is the expected one, so the last job needs only the legs' result. The download
      # succeeds in every case: download-artifact compares with the digest of the artifact that is there.
      - name: Compare the outcome with what is expected
        env:
          CASE: ${{ matrix.case }}
          OS: ${{ matrix.os }}
          DOWNLOAD: ${{ steps.download.outcome }}
          CHECK: ${{ steps.check.outcome }}
        run: |
          sha256sum --version 2>&1 | head -n 1 || true
          if [ "$CASE" = untouched ]; then expected=success; else expected=failure; fi
          echo "MEASURED: $OS: $CASE: download-artifact $DOWNLOAD, the check $CHECK (expected: success, $expected)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$DOWNLOAD" != success ] || [ "$CHECK" != "$expected" ]; then
            echo "::error::$OS: $CASE: not as expected. A check that reads success for a replaced case means the artifact was not replaced (see the replace jobs' MEASURED lines) or the check missed it."
            exit 1
          fi

  assert:
    name: The check refused every replaced artifact on every runner
    needs: [replace, check]
    if: ${{ !cancelled() && needs.check.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every leg saw what is expected
        env:
          REPLACE: ${{ needs.replace.result }}
          CHECK: ${{ needs.check.result }}
        run: |
          echo "MEASURED: the replace jobs: $REPLACE; the 30 check legs (6 cases on 5 runners): $CHECK" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$REPLACE" != success ] || [ "$CHECK" != success ]; then
            echo "::error::A leg did not see what is expected; read its MEASURED line."
            exit 1
          fi
          echo "MEASURED: another job of the same run replaced five artifacts, and on each of the 5 runners the check refused all five and accepted the untouched one." | tee -a "$GITHUB_STEP_SUMMARY"
