version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    # design §20.5, T25: a new version waits a week before Dependabot proposes it.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      analyzers:
        patterns:
          - "StyleCop.Analyzers"
          - "Microsoft.CodeAnalysis*"
      test:
        patterns:
          - "xunit*"
          - "Microsoft.Extensions.TimeProvider.Testing"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # design §20.5, T25: the actions run in the jobs that hold the publishing credentials.
    cooldown:
      default-days: 7

  # design §20.6, T27: the base image of elm-service, pinned by digest in the Dockerfile. Dependabot raises the digest even
  # when the tag stays the same. MCR gives no publication date, so the cooldown does not apply there yet; it is written for
  # the day it does, the same as the other ecosystems.
  - package-ecosystem: docker
    directory: /eng/container
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
