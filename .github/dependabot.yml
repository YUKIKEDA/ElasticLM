version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    # design §20.5, T25: a new version waits a week before Dependabot proposes it.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      analyzers:
        patterns:
          - "StyleCop.Analyzers"
          - "Microsoft.CodeAnalysis*"
      test:
        patterns:
          - "xunit*"
          - "Microsoft.Extensions.TimeProvider.Testing"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # design §20.5, T25: the actions run in the jobs that hold the publishing credentials.
    cooldown:
      default-days: 7
